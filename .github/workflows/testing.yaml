name: 'Testing'

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: 'Type Check & Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Settings requires the DB_* variables on import; the tests never connect to the database.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same uv as the Dockerfile's uv stage. Python comes from .python-version.
      - name: 'Install uv and Python'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          cache-python: true

      - name: 'Install Dependencies'
        run: uv sync --locked

      - name: 'Type Check'
        run: uv run pyright

      - name: 'Tests'
        run: uv run pytest
