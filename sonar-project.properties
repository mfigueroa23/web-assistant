# SonarQube Cloud analysis, run by the Security workflow (.github/workflows/security.yaml).
sonar.organization=w0rkspace
sonar.projectKey=w0rkspace_web-assistant
sonar.projectName=web-assistant

sonar.sources=main.py,src
sonar.tests=tests

# coverage.xml is generated by `uv run pytest --cov --cov-report=xml` in the same job.
sonar.python.coverage.reportPaths=coverage.xml

# The scan fails when the Quality Gate does not pass.
sonar.qualitygate.wait=true
