[project]
name = "web-assistant"
version = "1.0.0"
license = "Apache-2.0"
authors = [
    { name = "Marco Antonio Figueroa Sanchez", email = "marcofigueroa23@icloud.com" },
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.162.0",
    "langchain[google-genai]>=1.4.7",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["main.py", "src", "tests", "alembic"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["main", "src"]
